# Local orchestration for the customer storefront.
# The backend is expected to run separately (or be reachable at NEXT_PUBLIC_API_URL).
#
#   docker compose up --build
#
# Host port is fixed at 6003 across both servers (backend uses 6001, admin panel 6002).
# NEXT_PUBLIC_* are baked at build time, so changing them requires a rebuild.
services:
  storefront:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:6001/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:6003}
    image: sports-ecom/storefront:local
    container_name: sports-ecommerce-storefront
    ports:
      - "6003:3000"
    restart: unless-stopped
