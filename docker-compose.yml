# Local orchestration for the customer storefront.
# The backend is expected to run separately (or be reachable at NEXT_PUBLIC_API_URL).
#
#   docker compose up --build
#
# NEXT_PUBLIC_* are baked at build time, so changing them requires a rebuild.
services:
  storefront:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: sports-ecom/storefront:local
    ports:
      - "3000:3000"
    restart: unless-stopped
