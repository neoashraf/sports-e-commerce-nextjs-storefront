```yaml
name: CI/CD — Customer Storefront

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.15.0"

  CONTAINER_NAME: sports-ecommerce-storefront

  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://72.62.194.133:6001/api/v1' }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://72.62.194.133:6003' }}

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
        run: pnpm build

  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Select target server
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "HOST=${{ secrets.VPS_HOST }}" >> $GITHUB_ENV
            echo "USER=${{ secrets.VPS_USER }}" >> $GITHUB_ENV

            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.VPS_SSH_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            echo "ENVIRONMENT=production" >> $GITHUB_ENV

          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "HOST=${{ secrets.DEV_VPS_HOST }}" >> $GITHUB_ENV
            echo "USER=${{ secrets.DEV_VPS_USER }}" >> $GITHUB_ENV

            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.DEV_VPS_SSH_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            echo "ENVIRONMENT=development" >> $GITHUB_ENV
          fi

      - name: Validate VPS secrets
        run: |
          [ -z "$HOST" ] && echo "HOST missing" && exit 1
          [ -z "$USER" ] && echo "USER missing" && exit 1
          [ -z "$SSH_KEY" ] && echo "SSH KEY missing" && exit 1

          echo "Deploy target validated"

      - name: Deploy latest image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}

          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          echo "Deploying to $ENVIRONMENT server..."
          echo "Target: $USER@$HOST"

          ssh -i ~/.ssh/deploy_key "$USER@$HOST" << EOF
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Pulling latest image..."
            docker pull "$IMAGE_NAME:latest"

            echo "Stopping old container..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p 6003:3003 \
              -e NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              -e NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              --restart unless-stopped \
              "$IMAGE_NAME:latest"

            echo "Waiting for startup..."
            sleep 10

            docker ps --filter "name=$CONTAINER_NAME"

            echo "Recent logs:"
            docker logs --tail=50 "$CONTAINER_NAME"

            echo "Cleaning old images..."
            docker image prune -f

            echo "Deployment successful"
          EOF
```
